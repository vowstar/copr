# The crypto-policies back-end file holds options and algorithm names that an
# upstream openssh build does not implement: GSSAPIKexAlgorithms (from RHEL's
# GSSAPI-key-exchange patch, a feature upstream does not have at all) and, in
# the newer policies, names such as mlkem1024nistp384-sha384 (upstream 10.5
# implements ML-KEM-768 only).  sshd exits on the first unknown -o option, so
# the policy is audited against this binary before it is applied:
#
#   /usr/libexec/openssh/crypto-policy-args
#
# drops the options this sshd does not know and, inside an algorithm list, the
# names it does not support.  Whatever it drops is logged to the journal, never
# silently.
#
# To hand the policy to sshd verbatim instead, remove this drop-in or override
# ExecStart in /etc/systemd/system/sshd.service.d/.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/sbin/sshd -D $$OPTIONS $$(/usr/libexec/openssh/crypto-policy-args)'
