# Same audit as for sshd.service, for the socket-activated form: sshd@.service
# runs one sshd(-i) per connection and would otherwise be handed the raw
# crypto-policies options.  Remove this file (or override ExecStart in
# /etc/systemd/system/sshd@.service.d/) to pass the policy to sshd verbatim.
[Service]
ExecStart=
ExecStart=-/bin/sh -c 'exec /usr/sbin/sshd -i $$OPTIONS $$(/usr/libexec/openssh/crypto-policy-args)'
